name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version Cargo.toml declares as rust-version, so CI cannot pass on a compiler
      # newer than the one the crate promises to build with.
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # CI's /bin/sh is dash, so the cargo test below also runs tests/install.rs under dash.
      - run: shellcheck -s sh install.sh
      - run: cargo test

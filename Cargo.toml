[package]
name = "outlay"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
description = "Keyboard-driven xrandr layout editor that draws your monitors to scale in the terminal"
repository = "https://github.com/Papayah/outlay"
readme = "README.md"
keywords = ["xrandr", "monitor", "display", "tui", "x11"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
dirs = "7"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1"
signal-hook = "0.3"
thiserror = "2"
toml = "1.1"

[dev-dependencies]
insta = "1.48"
proptest = "1.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
